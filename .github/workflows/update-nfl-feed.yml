name: Refresh official NFL feed

on:
  push:
    paths:
      - ".github/workflows/update-nfl-feed.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official NFL YouTube uploads
        run: |
          python -m pip install --disable-pip-version-check --quiet yt-dlp
          yt-dlp \
            --flat-playlist \
            --playlist-end 50 \
            --dump-single-json \
            --no-warnings \
            "https://www.youtube.com/channel/UCDVYQ4Zhbm3S2dlz7P1xGg/videos" > nfl_source.json
          python - <<'PY'
          import json

          source = json.load(open("nfl_source.json", encoding="utf-8"))
          videos = []
          for item in source.get("entries", []):
              if not item:
                  continue
              vid = item.get("id", "")
              if not vid:
                  continue
              videos.append({
                  "id": vid,
                  "title": item.get("title", ""),
                  "publishedAt": item.get("upload_date", ""),
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
              })

          with open("nfl_videos.json", "w", encoding="utf-8") as f:
              json.dump({"videos": videos}, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit refreshed feed
        run: |
          git config user.name "Fred-Systems"
          git config user.email "Shragirim@gmail.com"
          git add nfl_videos.json
          if git diff --cached --quiet; then
            echo "NFL feed unchanged."
          else
            git commit -m "Refresh official NFL video feed"
            git push
          fi
