name: Refresh official NFL feed

on:
  push:
    paths:
      - ".github/workflows/update-nfl-feed.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official NFL YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set +e
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          key = os.environ.get("YOUTUBE_API_KEY", "")
          if not key:
              print("YOUTUBE_API_KEY is not configured; keeping existing NFL mirror.")
              raise SystemExit(0)

          params = urllib.parse.urlencode({
              "part": "snippet",
              "playlistId": "UUDVYQ4Zhbm3S2dlz7P1xGg",
              "maxResults": "50",
              "key": key
          })
          url = "https://www.googleapis.com/youtube/v3/playlistItems?" + params
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "SportsView-NFL-Feed/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
          except Exception as e:
              print(f"YouTube API unavailable ({e}); keeping existing NFL mirror.")
              raise SystemExit(0)

          videos = []
          for item in data.get("items", []):
              snippet = item.get("snippet", {})
              vid = snippet.get("resourceId", {}).get("videoId", "")
              if vid:
                  videos.append({
                      "id": vid,
                      "title": snippet.get("title", ""),
                      "publishedAt": snippet.get("publishedAt", ""),
                      "thumbnail": snippet.get("thumbnails", {}).get("high", {}).get("url")
                          or f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
                  })

          if videos:
              with open("nfl_videos.json", "w", encoding="utf-8") as f:
                  json.dump({"videos": videos}, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print(f"Updated NFL mirror with {len(videos)} videos.")
          else:
              print("YouTube API returned no videos; keeping existing NFL mirror.")
          PY
      - name: Commit refreshed feed
        run: |
          git config user.name "Fred-Systems"
          git config user.email "Shragirim@gmail.com"
          git add nfl_videos.json
          if git diff --cached --quiet; then
            echo "NFL feed unchanged."
          else
            git commit -m "Refresh official NFL video feed"
            git push
          fi
