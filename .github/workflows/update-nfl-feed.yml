name: Refresh official NFL feed

on:
  push:
    paths:
      - ".github/workflows/update-nfl-feed.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official NFL YouTube feed
        run: |
          python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET

          url = "https://www.youtube.com/feeds/videos.xml?channel_id=UCDVYQ4Zhbm3S2dlz7P1xGg"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=30).read()
          root = ET.fromstring(data)

          ns = {
            "atom": "http://www.w3.org/2005/Atom",
            "yt": "http://www.youtube.com/xml/schemas/2015",
            "media": "http://search.yahoo.com/mrss/"
          }

          videos = []
          for entry in root.findall("atom:entry", ns):
            vid = entry.findtext("yt:videoId", default="", namespaces=ns)
            title = entry.findtext("atom:title", default="", namespaces=ns)
            published = entry.findtext("atom:published", default="", namespaces=ns)
            thumb = ""
            group = entry.find("media:group", ns)
            if group is not None:
              t = group.find("media:thumbnail", ns)
              if t is not None:
                thumb = t.attrib.get("url", "")
            if vid:
              videos.append({
                "id": vid,
                "title": title,
                "publishedAt": published,
                "thumbnail": thumb or f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
              })

          with open("nfl_videos.json", "w", encoding="utf-8") as f:
            json.dump({"videos": videos}, f, ensure_ascii=False, indent=2)
            f.write("\n")
          PY

      - name: Commit refreshed feed
        run: |
          git config user.name "Fred-Systems"
          git config user.email "Shragirim@gmail.com"
          git add nfl_videos.json
          if git diff --cached --quiet; then
            echo "NFL feed unchanged."
          else
            git commit -m "Refresh official NFL video feed"
            git push
          fi
