name: Refresh official NFL feed

on:
  push:
    paths:
      - ".github/workflows/update-nfl-feed.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official NFL YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set +e
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          key = os.environ.get("YOUTUBE_API_KEY", "")
          if not key:
              print("YOUTUBE_API_KEY is not configured; keeping existing NFL mirror.")
              raise SystemExit(0)

          videos = []

          def add_video(vid, title, published_at, thumbnail):
              if not vid or any(v["id"] == vid for v in videos):
                  return
              videos.append({
                  "id": vid,
                  "title": title or "",
                  "publishedAt": published_at or "",
                  "thumbnail": thumbnail or f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
              })

          if key:
              try:
                  page_token = ""
                  while True:
                      query = {"part":"snippet","playlistId":"UUDVYQ4Zhbm3S2dlz7P1xGg","maxResults":"50","key":key}
                      if page_token:
                          query["pageToken"] = page_token
                      url = "https://www.googleapis.com/youtube/v3/playlistItems?" + urllib.parse.urlencode(query)
                      req = urllib.request.Request(url, headers={"User-Agent":"SportsView-NFL-Feed/1.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          data=json.load(response)
                      for item in data.get("items",[]):
                          snippet=item.get("snippet",{})
                          add_video(snippet.get("resourceId",{}).get("videoId",""),snippet.get("title",""),snippet.get("publishedAt",""),snippet.get("thumbnails",{}).get("high",{}).get("url"))
                      page_token=data.get("nextPageToken","")
                      if not page_token:
                          break
                  print(f"YouTube Data API returned {len(videos)} NFL videos.")
              except Exception as e:
                  print(f"YouTube Data API unavailable; trying public metadata mirrors: {e}")
                  videos=[]

          # Piped is only used as a metadata fallback. The IDs still point to
          # the official NFL YouTube uploads when the user plays a video.
          if not videos:
              instances=["https://pipedapi.kavin.rocks","https://api.piped.yt","https://pipedapi.leptons.xyz","https://pipedapi.adminforge.de"]
              for base in instances:
                  try:
                      nextpage=None
                      pages=0
                      while pages < 250:
                          endpoint=base+"/channel/UCDVYQ4Zhbm3S2dlz7P1xGg"
                          if nextpage:
                              endpoint=base+"/nextpage/channel/UCDVYQ4Zhbm3S2dlz7P1xGg?nextpage="+urllib.parse.quote(nextpage,safe="")
                          req=urllib.request.Request(endpoint,headers={"User-Agent":"SportsView-NFL-Feed/1.0","Accept":"application/json"})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              data=json.load(response)
                          streams=data.get("relatedStreams",[])
                          for item in streams:
                              path=item.get("url","")
                              vid=path.split("v=",1)[1].split("&",1)[0] if "v=" in path else ""
                              add_video(vid,item.get("title",""),item.get("uploadedDate",""),item.get("thumbnail",""))
                          nextpage=data.get("nextpage")
                          pages+=1
                          if not nextpage or not streams:
                              break
                      if len(videos)>6:
                          print(f"Piped fallback returned {len(videos)} NFL videos from {base}.")
                          break
                  except Exception as e:
                      print(f"Piped instance failed {base}: {e}")
              if not videos:
                  print("All NFL feed sources failed; keeping existing mirror.")
                  raise SystemExit(0)

          if videos:
              with open("nfl_videos.json", "w", encoding="utf-8") as f:
                  json.dump({"videos": videos}, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print(f"Updated NFL mirror with {len(videos)} videos.")
          else:
              print("YouTube API returned no videos; keeping existing NFL mirror.")
          PY
      - name: Commit refreshed feed
        run: |
          git config user.name "Fred-Systems"
          git config user.email "Shragirim@gmail.com"
          git add nfl_videos.json
          if git diff --cached --quiet; then
            echo "NFL feed unchanged."
          else
            git commit -m "Refresh official NFL video feed"
            git push
          fi
