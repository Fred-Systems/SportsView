name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SPORTSVIEW_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SPORTSVIEW_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias sportsview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Fred-Systems, OU=SportsView, O=Fred-Systems, C=US"

      - name: Build signed release APK
        env:
          SPORTSVIEW_KEYSTORE_PASSWORD: ${{ secrets.SPORTSVIEW_KEYSTORE_PASSWORD }}
          SPORTSVIEW_KEY_PASSWORD: ${{ secrets.SPORTSVIEW_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK and launcher configuration
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 500000
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "Checking packaged launcher entries..."
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "com.fredsystems.sportsviewer.MainActivity"
          "$BUILD_TOOLS/aapt2" dump xmltree "$APK" AndroidManifest.xml | grep -F "CalculatorAlias"
          echo "Source launcher safety checks..."
          grep -F 'android:enabled="true"' app/src/main/AndroidManifest.xml
          grep -F 'android:enabled="false"' app/src/main/AndroidManifest.xml
          grep -F 'calculator_mode_enabled' app/src/main/java/com/fredsystems/sportsviewer/MainActivity.kt
          echo "Startup hardening checks passed."

      - uses: actions/upload-artifact@v4
        with:
          name: SportsView-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.6" app/build/outputs/apk/release/*.apk \
            --title "SportsView 1.6" \
            --notes "SportsView 1.6: startup hardening, explicit calculator opt-in, lazy YouTube loading, and WebView crash protection." \
            --latest || \
          gh release upload "v1.6" app/build/outputs/apk/release/*.apk --clobber
