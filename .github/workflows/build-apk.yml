name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SPORTSVIEW_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SPORTSVIEW_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias sportsview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Fred-Systems, OU=SportsView, O=Fred-Systems, C=US"

      - name: Build signed release APK
        env:
          SPORTSVIEW_KEYSTORE_PASSWORD: ${{ secrets.SPORTSVIEW_KEYSTORE_PASSWORD }}
          SPORTSVIEW_KEY_PASSWORD: ${{ secrets.SPORTSVIEW_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SportsView-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.4" app/build/outputs/apk/release/*.apk \
            --title "SportsView 1.4" \
            --notes "SportsView 1.4: polished UI, manual landscape video mode, and stability improvements." \
            --latest || \
          gh release upload "v1.4" app/build/outputs/apk/release/*.apk --clobber
