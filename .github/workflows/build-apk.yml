name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "nfl_videos.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Temporary signing key for this release only. This APK will install,
      # but cannot update an installation signed with a different key.
      - name: Generate temporary release signing key
        run: |
          mkdir -p app
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias sportsview \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Fred-Systems, OU=SportsView, O=Fred-Systems, C=US"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "SPORTSVIEW_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SPORTSVIEW_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "SPORTSVIEW_KEY_ALIAS=sportsview" >> "$GITHUB_ENV"

      - name: Prepare launcher icons
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp SportsView_icon_picture.png app/src/main/res/drawable-nodpi/sportsview_launcher.png

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -gt 500000
          jarsigner -verify "$APK" >/dev/null
          echo "APK size: $SIZE bytes"
          echo "Temporary-key release APK verification passed."

      - uses: actions/upload-artifact@v4
        with:
          name: SportsView-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          APK="app/build/outputs/apk/release/app-release.apk"
          TAG="v$VERSION"
          test -n "$VERSION"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "SportsView $VERSION" \
              --notes "SportsView $VERSION. Signed with a temporary release key; uninstall the prior app before installing if Android reports a signature conflict." --latest
          fi
